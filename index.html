<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Het Proeven — Kleine gerechtjes. Grote obsessie.</title>
  <meta name="description" content="Van pintxo tot saté. Van cava tot rioja. Alles draait om smaak.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Het Proeven">
  <meta property="og:title" content="Het Proeven — Kleine gerechtjes. Grote obsessie.">
  <meta property="og:description" content="Van pintxo tot saté. Van cava tot rioja. Alles draait om smaak.">
  <meta property="og:url" content="https://www.hetproeven.nl/">
  <meta property="og:image" content="https://www.hetproeven.nl/assets/images/og-default.jpg">
  <link rel="canonical" href="https://www.hetproeven.nl/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

  <nav class="nav">
    <a href="/" class="logo">Het Proeven</a>
    <div class="nav-links">
      <a href="/">Recepten</a>
      <a href="/over.html">Over</a>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Kleine gerechtjes.<br>Grote obsessie.</h1>
      <p>Van pintxo tot saté. Van cava tot rioja. Alles draait om smaak.</p>
    </div>
  </header>

  <div class="filter-wrap">
    <div class="filter-row">
      <span class="filter-label">Soort</span>
      <div class="filter-bar" id="filter-categorie">
        <button class="filter-btn active" data-filter="all">Alles</button>
        <button class="filter-btn" data-filter="hapjes-tapas">Hapjes & Tapas</button>
        <button class="filter-btn" data-filter="vis-zeevruchten">Vis & Zeevruchten</button>
        <button class="filter-btn" data-filter="vlees">Vlees</button>
        <button class="filter-btn" data-filter="groente-salade">Groente & Salade</button>
        <button class="filter-btn" data-filter="soep">Soep</button>
        <button class="filter-btn" data-filter="pasta-rijst">Pasta & Rijst</button>
        <button class="filter-btn" data-filter="dessert">Dessert</button>
      </div>
    </div>

    <div class="filter-row filter-row-keuken">
      <span class="filter-label">Keuken</span>
      <div class="filter-bar" id="filter-keuken">
        <button class="filter-btn-sm active" data-filter="all">Alles</button>
        <button class="filter-btn-sm" data-filter="Spaans">🇪🇸 Spaans</button>
        <button class="filter-btn-sm" data-filter="Italiaans">🇮🇹 Italiaans</button>
        <button class="filter-btn-sm" data-filter="Nederlands">🇳🇱 Nederlands</button>
        <button class="filter-btn-sm" data-filter="Indonesisch">🇮🇩 Indonesisch</button>
        <button class="filter-btn-sm" data-filter="Grieks">🇬🇷 Grieks</button>
        <button class="filter-btn-sm" data-filter="Frans">🇫🇷 Frans</button>
        <button class="filter-btn-sm" data-filter="Thais">🇹🇭 Thais</button>
        <button class="filter-btn-sm" data-filter="Chinees">🇨🇳 Chinees</button>
        <button class="filter-btn-sm" data-filter="Japans">🇯🇵 Japans</button>
      </div>
    </div>
  </div>

  <div class="recipe-grid" id="recipe-grid">
    <div class="loading">Recepten laden…</div>
  </div>

  <footer>
    <p>© Het Proeven</p>
    <a href="/admin/">Recepten beheren</a>
  </footer>

  <script>
    let allRecipes = [];
    let activeKeuken = 'all';
    let activeCategorie = 'all';


    // ── Lazy loading kaartfoto's ─────────────────────────────────
    function initLazyBg() {
      if (!('IntersectionObserver' in window)) {
        // Fallback: laad alles direct
        document.querySelectorAll('.lazy-bg[data-bg]').forEach(el => {
          el.style.backgroundImage = 'url(' + el.dataset.bg + ')';
        });
        return;
      }
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const el = entry.target;
            el.style.backgroundImage = 'url(' + el.dataset.bg + ')';
            el.classList.remove('lazy-bg');
            obs.unobserve(el);
          }
        });
      }, { rootMargin: '200px' });

      document.querySelectorAll('.lazy-bg[data-bg]').forEach(el => obs.observe(el));
    }

    function renderRecipes() {
      const grid = document.getElementById('recipe-grid');
      let filtered = allRecipes;
      if (activeKeuken !== 'all') filtered = filtered.filter(r => r.keuken === activeKeuken);
      if (activeCategorie !== 'all') filtered = filtered.filter(r => r.categorie === activeCategorie);
      if (filtered.length === 0) {
        grid.innerHTML = '<p class="empty">Geen recepten gevonden.</p>';
        return;
      }
      grid.innerHTML = filtered.map((r, i) => {
        const wineNaam = r.wine && typeof r.wine === 'object' ? r.wine.naam : r.wine;
        // Eerste 6 kaartjes laden direct, de rest lazy via IntersectionObserver
        const eager = i < 6;
        const imgAttr = r.image
          ? (eager ? `style="background-image:url(${r.image})"` : `data-bg="${r.image}"`)
          : '';
        return `
          <a href="/recepten/${encodeURIComponent(r.slug)}" class="card">
            <div class="card-img${eager ? '' : ' lazy-bg'}" ${imgAttr}></div>
            <div class="card-body">
              <div class="card-loc">${r.location || ''}</div>
              <div class="card-title">${r.title}</div>
              <p>${r.short_description || ''}</p>
              <div class="tags">
                ${r.time ? `<span class="tag">${r.time}</span>` : ''}
                ${r.difficulty ? `<span class="tag tag-acc">${r.difficulty}</span>` : ''}
                ${wineNaam ? `<span class="tag tag-wine">🍷 ${wineNaam}</span>` : ''}
              </div>
            </div>
          </a>`;
      }).join('');
    }

    document.querySelectorAll('#filter-categorie .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filter-categorie .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategorie = btn.dataset.filter;
        renderRecipes();
        initLazyBg();
      });
    });

    document.querySelectorAll('#filter-keuken .filter-btn-sm').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filter-keuken .filter-btn-sm').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeKeuken = btn.dataset.filter;
        renderRecipes();
        initLazyBg();
      });
    });

    fetch('/data/recipes.json')
      .then(r => r.json())
      .then(data => {
        allRecipes = (data.recipes || []).slice().reverse();
        renderRecipes();
        initLazyBg();
      })
      .catch(() => {
        document.getElementById('recipe-grid').innerHTML = '<p class="empty">Recepten konden niet worden geladen.</p>';
      });

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
      });
    }
  </script>
</body>
</html>
