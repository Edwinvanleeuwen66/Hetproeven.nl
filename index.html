  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    /* ===== FILTER & ZOEK BAR ===== */
    .filter-bar {
      max-width: 1100px;
      margin: 0 auto 2rem;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .zoek-wrap {
      position: relative;
    }
    .zoek-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 44px 12px 16px;
      border: 1px solid #D4C8B4;
      border-radius: 24px;
      font-family: 'Lato', sans-serif;
      font-size: 15px;
      color: #2B1A0D;
      background: #fff;
      outline: none;
      transition: border-color .2s;
    }
    .zoek-input:focus { border-color: #B85C30; }
    .zoek-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #B85C30;
      font-size: 16px;
      pointer-events: none;
    }
    .filter-rijen {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-btn {
      padding: 7px 16px;
      border: 1px solid #D4C8B4;
      border-radius: 20px;
      background: #fff;
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      color: #4A3728;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .filter-btn:hover { background: #F5EFE6; border-color: #B85C30; }
    .filter-btn.actief { background: #B85C30; color: #fff; border-color: #B85C30; }
    .filter-divider {
      width: 1px;
      height: 28px;
      background: #D4C8B4;
      align-self: center;
      margin: 0 4px;
    }

    /* ===== PORTIE SCHUIF ===== */
    .portie-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      color: #7A6A5A;
    }
    .portie-wrap label { font-weight: 600; color: #4A3728; }
    .portie-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 120px;
      height: 4px;
      border-radius: 2px;
      background: #D4C8B4;
      outline: none;
      cursor: pointer;
    }
    .portie-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      background: #B85C30;
      cursor: pointer;
    }
    .portie-val {
      font-weight: 700;
      color: #B85C30;
      min-width: 20px;
    }

    /* ===== RESULTATEN TELLER ===== */
    .resultaat-teller {
      max-width: 1100px;
      margin: 0 auto .75rem;
      padding: 0 24px;
      font-family: 'Lato', sans-serif;
      font-size: 12px;
      color: #aaa;
      letter-spacing: .05em;
    }

    /* ===== GRID ===== */
    .recept-grid {
      max-width: 1100px;
      margin: 0 auto 4rem;
      padding: 0 24px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 28px;
    }
    .recept-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(43,26,13,.07);
      transition: transform .2s, box-shadow .2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }
    .recept-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(43,26,13,.13);
    }
    .card-img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #F5EFE6;
    }
    .card-img-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #F5EFE6, #E8D8C4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
    .card-body {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .card-cat {
      font-size: 9px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #B85C30;
      margin-bottom: 6px;
    }
    .card-title {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      line-height: 1.35;
      color: #2B1A0D;
      margin-bottom: 8px;
    }
    .card-desc {
      font-family: 'Lato', sans-serif;
      font-size: 13px;
      color: #7A6A5A;
      line-height: 1.6;
      flex: 1;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: .5px solid #F0E8D8;
    }
    .card-tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      background: #F5EFE6;
      color: #7A6A5A;
    }
    .card-portie {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      background: #EEF4EE;
      color: #4A7A4A;
      font-weight: 600;
    }

    /* ===== GEEN RESULTATEN ===== */
    .geen-resultaten {
      grid-column: 1/-1;
      text-align: center;
      padding: 3rem;
      color: #aaa;
      font-family: 'Lato', sans-serif;
    }
    .geen-resultaten h3 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      color: #7A6A5A;
      margin-bottom: .5rem;
    }

    @media(max-width:640px) {
      .filter-bar { padding: 0 16px; }
      .recept-grid { padding: 0 16px; gap: 16px; }
      .filter-divider { display: none; }
    }
  </style>

  <script>
  const RECEPTEN = [{"slug": "chistorra-pintxo-origineel", "title": "Pintxo de chistorra met paprika, aioli en kappertjes", "short_description": "Pittige Baskische worst op brood met zelfgemaakte aioli, geroosterde paprika en zilte kappertjes.", "image": "/assets/images/chistorra-pintxo-origineel.jpg", "time": "20 min", "servings": "6 pintxos", "difficulty": "Makkelijk", "keuken": "Spaans", "categorie": "hapjes-tapas", "location": "Bilbao", "zoek": "pintxo de chistorra met paprika, aioli en kappertjes pittige baskische worst op brood met zelfgemaakte aioli, geroosterde paprika en kappertjes. de kappertjes zijn hier geen garnering — ze zijn de zilte tegenhanger van het vet. bilbao spaans chistorra (baskische dunne worst) sneetjes stokbrood geroosterde paprika uit blik kappertjes, uitgelekt bieslook, fijngehakt eidooier knoflookteentjes, geperst olijfolie extra vierge citroensap zout"}, {"slug": "watermeloen-feta-shot", "title": "Watermeloen-feta-shot", "short_description": "IJskoude watermeloengazpacho met gepofte feta en basilicumolie — de perfecte zomerse openingspintxo.", "image": "/assets/images/watermeloen-shot.jpg", "time": "10 min + 1 uur koelen", "servings": "8 shots", "difficulty": "Makkelijk", "keuken": "Spaans", "categorie": "hapjes-tapas", "location": "Andalusië", "zoek": "watermeloen-feta-shot een verfrissende ijskoude shot van watermeloengazpacho met een blokje gepofte feta en geurige basilicumolie. andalusië spaans watermeloen, zonder schil en pitten komkommer, geschild en ontpit rode paprika, geroosterd en gepeld rode wijnazijn olijfolie extra vierge zout feta in één blok honing verse basilicum olijfolie extra vierge"}, {"slug": "boquerones-aardappelchip", "title": "Boquerones op aardappelchip met citroen-peterseliemayo", "short_description": "Knapperige zelfgemaakte aardappelchip, citroen-peterseliemayo en een ingelegde boquerón — een elegante Spaanse pintxo.", "image": "/assets/images/boqurones.jpg", "time": "30 min", "servings": "4 personen", "difficulty": "Makkelijk", "keuken": "Spaans", "categorie": "vis-zeevruchten", "location": "Spanje", "zoek": "boquerones op aardappelchip met citroen-peterseliemayo knapperige zelfgemaakte aardappelchip als basis, een dot citroen-peterseliemayo en een ingelegde boquerón erop — een elegante spaanse pintxo in drie happen. spanje spaans grote vastkokende aardappelen olijfolie zout eidooiers zonnebloemolie knoflookteen, zeer fijn gehakt citroen, rasp en sap platte peterselie, fijngehakt zout boquerones (ingelegde ansjovis)"}, {"slug": "bilbainito-garnaal-ei", "title": "Bilbainito — garnaal en ei op tandenstoker", "short_description": "De iconische Bilbao-pintxo uit de jaren '60 — garnaal en hardgekookt ei op een tandenstoker met mayo en geraspt ei.", "image": "/assets/images/garnaal-op-ei.jpg", "time": "25 min", "servings": "6 pintxos", "difficulty": "Makkelijk", "keuken": "Spaans", "categorie": "hapjes-tapas", "location": "Bilbao", "zoek": "bilbainito — garnaal en ei op tandenstoker de iconische pintxo uit bilbao — gekookte garnaal en hardgekookt ei op een tandenstoker, afgetopt met huisgemaakte mayonaise en geraspt ei. simpel, retro en verrassend lekker. bilbao spaans grote garnalen, gepeld en gekookt hardgekookte eieren ei, kamertemperatuur zonnebloemolie citroensap zout"}, {"slug": "patatas-bravas-madrid", "title": "Patatas bravas — de echte Madrileense versie", "short_description": "Krokante aardappels met de originele bravasaus zonder tomaat — pikant, rokerig en echt Madrileens.", "image": "/assets/images/patatas-bravas.jpg", "time": "35 min", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Spaans", "categorie": "hapjes-tapas", "location": "Madrid", "zoek": "patatas bravas — de echte madrileense versie de enige echte madrileense patatas bravas — krokante aardappels met een pittige olie-knoflook-pimentónsaus zonder tomaat, en een snelle aioli ernaast. zo worden ze al decennialang geserveerd in de oude bodegas van madrid. madrid spaans vastkokende aardappelen zonnebloemolie om te frituren zout olijfolie extra vierge knoflookteentjes, fijn gehakt pimentón picante pimentón dulce bloem warme kippenbouillon rode wijnazijn mayonaise uit de pot knoflookteen, geperst citroensap"}, {"slug": "empanadas-de-pollo", "title": "Empanadas de pollo — gestoofde kip met piquillo", "short_description": "Sappige kipvulling met piquillo en paprika in kant-en-klare deegvelletjes — perfect om van tevoren te maken.", "image": "/assets/images/empanadas-poll.jpg", "time": "45 min", "servings": "12 stuks", "difficulty": "Gemiddeld", "keuken": "Spaans", "categorie": "vlees", "location": "Spanje", "zoek": "empanadas de pollo — gestoofde kip met piquillo sappige kipvulling van gestoofd en getrokken kipfilet met piquillo en paprika in kant-en-klare empanada deegvelletjes — de perfecte tapa die je van tevoren kunt maken en warm of op kamertemperatuur serveert. spanje spaans ronde kant-en-klare empanada deegvelletjes ei voor het bestrijken kipfilet kippenbouillon ui, fijn gesnipperd knoflookteentjes, fijn gehakt rode paprika, fijn gesneden piquillopepers uit pot, fijn gesneden pimentón dulce komijnpoeder olijfolie zout en peper"}, {"slug": "venusschelpen-salsa-verde", "title": "Venusschelpen in salsa verde", "short_description": "Venusschelpen heel kort gestoomd, uit de schelp gehaald en geserveerd in een zijdezachte groene saus.", "image": "/assets/images/venusschelpen-salsa-verde.jpg", "time": "25 min", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Spaans", "categorie": "vis-zeevruchten", "location": "Baskenland", "zoek": "venusschelpen in salsa verde een klassiek baskisch gerecht — venusschelpen heel kort gestoomd, uit de schelp gehaald en geserveerd in een zijdezachte groene saus van peterselie, knoflook en witte wijn. baskenland spaans venusschelpen of kokkels, goed gespoeld droge witte wijn knoflookteentjes, zeer fijn gehakt platte peterselie, fijngehakt olijfolie extra vierge bloem zout en peper"}, {"slug": "soldaditos-de-pavia", "title": "Soldaditos de Pavía — witvis in krokant rijstbloembeslag", "short_description": "Witvis in luchtig rijstbloembeslag, gestapeld op brood met aioli en geroosterde paprika.", "image": "/assets/images/witvis.jpg", "time": "30 min", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Spaans", "categorie": "vis-zeevruchten", "location": "Sevilla", "zoek": "soldaditos de pavía — witvis in krokant rijstbloembeslag de klassieker uit sevilla — reepjes witvis in een luchtig krokant beslag van bloem en harina de arroz met ijskoud bruiswater. knisperend krokant, gestapeld op brood met aioli en geroosterde paprika. sevilla spaans kabeljauwfilet zonder vel en graten, in reepjes knoflookteentjes, geperst citroensap zout voor de marinade bloem, plus extra om vis door te halen harina de arroz (rijstbloem) eidooier, ijskoud ijskoud bruiswater of bier zout zonnebloemolie voor frituren sneetjes stokbrood, geroosterd mayonaise knoflookteen voor aioli, geperst citroensap voor aioli geroosterde rode paprika uit blik, in reepjes platte peterselie, grof gehakt fleur de sel"}, {"slug": "manchego-frito-membrillo", "title": "Manchego frito met membrillo", "short_description": "Plakjes manchego gepaneerd en gebakken tot goudbruin — geserveerd met zoete kweepeergelei.", "image": "/assets/images/manchego-frito-membrillo.jpg", "time": "20 min", "servings": "4 personen", "difficulty": "Makkelijk", "keuken": "Spaans", "categorie": "hapjes-tapas", "location": "Spanje", "zoek": "manchego frito met membrillo plakjes manchego gepaneerd in panko en snel gebakken tot goudbruin en smeltend van binnen — geserveerd met zoete membrillo. warm en koud, zoet en zout, romig en krokant in één hap. spanje spaans manchego, in plakken van 1 cm dik eieren, losgeklopt panko of fijn paneermeel bloem zwarte peper zonnebloemolie om te bakken membrillo (kweepeergelei), in plakjes"}, {"slug": "tosta-manchego-vijgencompote", "title": "Tosta met manchego, vijgencompote en walnoot", "short_descripti kt verse gember, fijn geraspt olijfolie of neutrale olie suiker zout en witte peper eieren, losgeklopt balsamico azijn citroensap sesamolie lente-ui, fijngesneden paar druppels goede olijfolie om op te serveren"}, {"slug": "surinaams-broodje-kip-kerrie", "title": "Surinaams broodje kip kerrie met zelfgemaakte komkommer atjar", "short_description": "Kip kerrie in diepe Surinaamse stijl — met geactiveerde curry, Madame Jeanette en glanzende ketjapsaus op een luchtig puntje met komkommer atjar.", "image": "/assets/images/surinaams-broodje-kip-kerrie.jpg", "time": "50 min + 2 uur rijzen (puntje) + 1 uur atjar", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Indonesisch", "categorie": "hapjes-tapas", "location": "Paramaribo", "zoek": "surinaams broodje kip kerrie met zelfgemaakte komkommer atjar een surinaams broodje kip kerrie is geen toevallig samenstel — het is een evenwicht. zoet van ketjap, kruidig van kerrie, pittig van madame jeanette, fris van atjar. de kip moet glanzen en plakken, niet zwemmen. het broodje mag licht vochtig worden, niet zompig. paramaribo indonesisch tarwebloem (11–12% eiwit) water, kamertemperatuur droge gist suiker zout neutrale olie of zachte boter fijn griesmeel of semola om in te rollen kipdijfilet of kipfilet, in hapklare stukken grote ui, fijngesnipperd knoflookteentjes, fijngehakt kerriepoeder of masala ketjap manis sambal oelek tomaten uit blik tomatenpuree kippenbouillon paprikapoeder bruine suiker madame jeanette peper, heel gelaten klontje boter neutrale olie zout komkommer, in de lengte gehalveerd, kern uitgelepeld, dun gesneden kleine ui, in dunne halve ringen natuurazijn suiker zout kurkuma sambal of chilivlokken (optioneel) surinaamse puntjes of kleine stokbroodjes mayonaise"}, {"slug": "surinaams-broodje-stoofvlees", "title": "Surinaams broodje stoofvlees met ketjap, piment en peperzuur", "short_description": "Riblappen gemarineerd in ketjap, piment en komijn, donker aangebraden en gestoofd tot draadjesmals — me , zeer goed uitgelekt crème fraîche mayonaise citroen, rasp en een paar druppels sap witte peper zout bieslook of lente-ui, zeer fijn gesneden zwarte sesam extra bieslook of lente-ui citroenolie of een druppel goede olijfolie"}, {"slug": "vichyssoise-bieslookolie-roomijs", "title": "Vichyssoise met bieslookolie en gezouten roomijs", "short_description": "IJskoude prei-aardappelsoep, fluweelzacht gezeefd, met een quenelle gezouten roomijs en felgroene bieslookolie.", "image": "/assets/images/vichyssoise-bieslookolie-roomijs.jpg", "time": "45 min + 3 uur koelen", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Frans", "categorie": "soep", "location": "Parijs", "zoek": "vichyssoise met bieslookolie en gezouten roomijs vichyssoise is de elegantste koude soep die er bestaat — prei, aardappel, room, weinig meer. de kracht zit in de techniek: lang genoeg zeven voor het fluweelzachte gevoel, lang genoeg koelen voor de perfecte temperatuur. het gezouten roomijs is geen grap — het versterkt de romigheid en geeft een verrassing bij elke lepel. parijs frans preien, alleen het witte en lichtgroene deel, in ringen sjalot, fijngesnipperd kruimige aardappels, geschild en in blokken ongezouten boter lichte kippenbouillon of groentebouillon slagroom zout witte peper slagroom fijn zeezout suiker verse bieslook neutrale olie (druivenpit of zonnebloem) zout"}, {"slug": "krabsalade-mango-kaffir-crisp", "title": "Krabsalade met mango, kaffir-limoenolie en rijstpapiercrisp", "short_description": "Verse krabsalade met rijpe mango, geparfumeerd met kaffir-limoenolie en geserveerd op een luchtige rijstpapiercrisp.", "image": "/assets/images/krabsalade-mango-kaffir-crisp.jpg", "time": "20 min", "servings": "4 personen", "difficulty": "Makkelijk", "keuken": "Thais", "categorie": "vis-zeevruchten", "location": "Bangkok", "zoek": "krabsalade met mango, kaffir-limoenolie en rijstpapiercrisp krab en mango zijn elkaars natuurlijke partners: de zoetheid van de mango versterkt de delicate zoute smaak van het krabvlees, terwijl de kaffir-limoenolie het geheel omhult met een aromatische frisheid. de rijstpapiercrisp geeft de knapperige textuur die dit hapje compleet maakt. bangkok thais verse krabsalade van de visboer rijpe mango, in kleine blokjes van ±5 mm lente-ui, zeer fijn gesneden limoensap zout en witte peper kaffir-limoenblaadjes, nerven verwijderd, zeer fijn gesneden neutrale olie (druivenpit) zout rijstpapier vellen neutrale olie zout rode peper, zeer fijn gesneden verse koriander limoenwedge"}, {"slug": "langoustine-filodeeg-appel-dragon", "title": "Langoustine in filodeeg met appel, gember en dragon", "short_description": "Langoustine strak ingepakt in krokant filodeeg met een vulling van appel, gember en verse dragon.", "image": "/assets/images/langoustine-filodeeg-appel-dragon.jpg", "time": "35 min", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Frans", "categorie": "vis-zeevruchten", "location": "Bretagne", "zoek": "langoustine in filodeeg met appel, gember en dragon langoustine is te goed voor een zware saus. hier wordt hij beschermd door een krokante filomantel die tegelijkertijd de smaak insluit en de textuur bewaakt. de combinatie appel-gember-dragon is geen aziatisch gebaar — het is puur frans: friszuur, kruidig en aromatisch. bretagne frans langoustines, gepeld en darmkanaal verwijderd zout en witte peper druppel olijfolie granny smith appel, geschild en in zeer kleine brunoise verse gember, fijn geraspt verse dragon, fijngehakt crème fraîche limoensap zout filodeeg vellen, ontdooid ongezouten boter, gesmolten dragonboter of druppel bruine boter met dragon fleur de sel citroenpartje"}, {"slug": "tonda-romana-pizza", "title": "Tonda Romana — dunne Romeinse pizza met zesdaags deeg", "short_description": "Flinterdunne Romeinse pizza op 60% hydratatie — krokant, elegant en gebakken op maximale vuur in 90 seconden.", "image": "/assets/images/tonda-romana-pizza.jpg", "time": "30 min + 6–7 uur fermentatie", "servings": "2 pizza's", "difficulty": "Gemiddeld", "keuken": "Italiaans", "categorie": "pasta-rijst", "location": "Roma", "zoek": "tonda romana — dunne romeinse pizza met zesdaags deeg de tonda romana is het tegenovergestelde van napolitaans: geen luchtbellen, geen zachte rand, geen chewiness. dun, krokant, elegant. het deeg wordt uitgerold — niet getost — en gebakken op een vloeropperevlak van 430–450°c. zes uur fermentatie bij kamertemperatuur maakt het deeg super rekbaar en smaakvol. roma italiaans caputo pizzeria of sterke pizzabloem (w300+) water, kamertemperatuur (60%) fijn zeezout olijfolie droge gist (of 2,5 g verse gist) san marzano tomaten uit blik, geplet met de hand zout oregano"}, {"slug": "lauwwarme-oester-schorseneer-kaviaar", "title": "Lauwwarme oester met ingelegde schorseneer, aardappelchip en Baerii-kaviaar", "short_description": "Warme oester op ingezuurde schorseneer, met een krokante aardappelchip als dakje en een dot crème fraîche met Baerii-kaviaar.", "image": "/assets/images/lauwwarme-oester-schorseneer-kaviaar.jpg", "time": "45 min", "servings": "4 amuses", "difficulty": "Gemiddeld", "keuken": "Japans", "categorie": "hapjes-tapas", "location": "Zeeland", "zoek": "lauwwarme oester met ingelegde schorseneer, aardappelchip en baerii-kaviaar eén hap, vier texturen. de lauwwarme oester is het hart — amper aangeraakt door hitte, nog volledig van het water. de ingezuurde schorseneer geeft aards tegenwicht, de chip knapperige structuur, de kaviaar zilte diepte. serveer op lei of schelp. zeeland japans schorseneer, geschild en in citroenwater gelegd witte wijnazijn water fijne kristalsuiker fijn zout bintje of agria-aardappel, flinterdun gesneden op mandoline zonnebloemolie om te frituren fleur de sel verse zeeuwse creuse oesters, nr. 3 crème fraîche, vol en ongeslagen baerii-kaviaar verse bieslook, kort neutrale olie"}, {"slug": "ravioli-tarbot-spinazie-champagne-beurre-blanc", "title": "Ravioli van tarbot en spinazie met champagne-beurre blanc en Baerii-kaviaar", "short_description": "Delicate ravioli van wontonvel gevuld met tarbot en spinazie, gedrenkt in een glanzende champagne-beurre blanc met zeekraal en kaviaar.", "image": "/assets/images/ravioli-tarbot-spinazie-champagne-beurre-blanc.jpg", "time": "55 min", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Frans", "categorie": "pasta-rijst", "location": "Parijs", "zoek": "ravioli van tarbot en spinazie met champagne-beurre blanc en baerii-kaviaar ravioli die smaken naar zee. de vulling van tarbot en geperste spinazie is neutraal en delicaat — de champagne-beurre blanc is het gerecht. zeekraal geeft een zilte, krokante tegenhanger. kaviaar op het allerlaatste moment. parijs frans ronde dim sum-blaadjes of wontonvellen eiwit, losgeklopt tarbotfilet, zonder vel en graten, in kleine blokjes verse spinazie, geblancheerd, uitgeknepen en fijngehakt kleine sjalot, zeer fijn gesnipperd boter volle crème fraîche eidooier citroenschil, fijn geraspt citroensap zeezout en witte peper sjalot, fijn gesnipperd brut champagne of droge crémant lichte visfumet volle room koude boter, in blokjes reepje citroenschil + paar druppels sap zeekraal, schoongemaakt baerii-kaviaar bieslook, in fijne ringetjes"}, {"slug": "steak-tartaar-toast-eidooieremulsie", "title": "Steak tartaar op toast met eidooieremulsie en krokante kappertjes", "short_description": "Verse tartaar op krokant toastdriehoekje met een zijdezachte eidooieremulsie en de zoute crunch van gefrituurde kappertjes.", "image": "/assets/images/steak-tartaar-toast-eidooieremulsie.jpg", "time": "25 min", "servings": "4 amuses", "difficulty": "Makkelijk", "keuken": "Frans", "categorie": "hapjes-tapas", "location": "Parijs", "zoek": "steak tartaar op toast met eidooieremulsie en krokante kappertjes tartaar in zijn puurste amuse-vorm. het vlees is de hoofdrol — koop het die ochtend bij de keurslager. de eidooieremulsie is rijker dan mayo en zachter dan hollandaise. de gefrituurde kappertjes zijn het verrassingsmoment: zout, krokant, en net iets anders dan verwacht. parijs frans verse steak tartaar van de keurslager kleine sjalot, zeer fijn gesnipperd dijon-mosterd cornichons, fijn gesneden kappertjes, fijn gesneden goede olijfolie worcestershire sauce tabasco platte peterselie, fijn gesneden zeezout en zwarte peper verse eidooiers dijon-mosterd witte wijnazijn citroensap zonnebloemolie volle crème fraîche worcestershire sauce zeezout en witte peper kleine kappertjes, goed drooggedept witbrood, geroosterd en in driehoekjes zachte boter"}, {"slug": "gestoomde-eiercustard-coquille-sinaasappel", "title": "Gestoomde eiercustard met coquille in sinaasappelschil", "short_description": "Zijdezachte eiercustard in de stijl van chawan mushi, gestoomd in een uitgeholde sinaasappelschil met een halve coquille en citrusaroma.", "image": "/assets/images/gestoomde-eiercustard-coquille-sinaasappel.jpg", "time": "50 min", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Japans", "categorie": "hapjes-tapas", "location": "Kyoto", "zoek": "gestoomde eiercustard met coquille in sinaasappelschil chawan mushi — de japanse gezeefde eiercustard — hier gestoomd in een sinaasappelschil als kom. het citrusaroma trekt langzaam door de custard terwijl hij gaart. de coquille ligt erin als een parel. elegant, onverwacht en technisch precies. kyoto japans grote sinaasappels (navel of bloedsinaasappel) grote eieren, kamertemperatuur lichte visfumet of kippenbouillon volle room sinaasappelschil, fijn geraspt zeezout, witte peper en nootmuskaat grote coquilles, zonder koraal, horizontaal gehalveerd bieslook, fijn gesneden dragon of kervel citrusolie of olijfolie"}, {"slug": "sukiyaki-ossenhaas-warishita", "title": "Sukiyaki — flinterdun ossenhaas in warishita met shiitake, tofu en rauw eigeel", "short_description": "Flinterdun gesneden ossenhaas even aangeraakt in simmerende warishita met shiitake, zachte tofu en jonge spinazie — gedoopt in rauw eigeel.", "image": "/assets/images/sukiyaki-ossenhaas-warishita.jpg", "time": "35 min", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Japans", "categorie": "vlees", "location": "Osaka", "zoek": "sukiyaki — flinterdun ossenhaas in warishita met shiitake, tofu en rauw eigeel sukiyaki in zijn meest verfijnde vorm. de warishita-saus — sake, mirin, soja, dashi en suiker — is de ziel van het gerecht. het vlees wordt er amper in aangeraakt: 10–15 seconden volstaan. het rauwe eigeel is geen optie maar het handtekening van eeuwenoude japanse tafeltraditie. osaka japans sake mirin lichte sojasaus dashi (instant) fijne kristalsuiker plakjes verse gember kombu (optioneel) ossenhaas of entrecôte, flinterdun gesneden (±2 mm) shiitakes, steeltjes verwijderd zachte tofu (silken), in blokjes van 2 cm jonge spinazie shirataki-noodles neutrale olie verse eidooiers, rauw, elk in apart schaaltje lente-uitjes, in dunne schuine ringen sesamolie shichimi togarashi (optioneel)"}, {"slug": "mini-onigiri-tonijn-garnaal", "title": "Mini-onigiri in twee smaken: tonijn-Kewpie en garnaal-paprika", "short_description": "Twee Japanse rijstballetjes per gast — één met romige tonijn-Kewpie, één met frisse garnaal en geroosterde paprika.", "image": "/assets/images/mini-onigiri-tonijn-garnaal.jpg", "time": "45 min", "servings": "4 amuses", "difficulty": "Makkelijk", "keuken": "Japans", "categorie": "hapjes-tapas", "location": "Tokyo", "zoek": "mini-onigiri in twee smaken: tonijn-kewpie en garnaal-paprika onigiri als amuse: twee balletjes, twee smaken, twee karakters. de tonijn-kewpie is romig en zacht, de garnaal-paprika fris en licht pittig. nori op het allerlaatste moment — een kwartier eerder en hij is al slap. tokyo japans sushirijst water rijstazijn fijne kristalsuiker fijn zout tonijn uit blik op water, goed uitgelekt kewpie-mayonaise lente-ui, zeer fijn gesneden geroosterd sesamzaad lichte sojasaus citroensap en zwarte peper kleine gare garnalen, fijngehakt geroosterde paprika uit blik, fijn gesneden en drooggedept kewpie-mayonaise bieslook, fijn gesneden lichte sojasaus en citroensap wasabipasta nori, in kleine rechthoekjes geroosterd sesamzaad en bieslookringen"}, {"slug": "chirashi-sushi-coquille-garnaal-tonijn", "title": "Chirashi-sushi met coquille, garnaal en tonijn", "short_description": "Gezuurde sushirijst als warme basis met goudbruin aangebakken coquille, garnalen, aangemaakte tonijn, omeletlinten en avocado.", "image": "/assets/images/chirashi-sushi-coquille-garnaal-tonijn.jpg", "time": "50 min", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Japans", "categorie": "vis-zeevruchten", "location": "Tokyo", "zoek": "chirashi-sushi met coquille, garnaal en tonijn chirashi is japan in een kom: rijst als canvas, toppings als kleurenwiel. de coquille is het middelpunt — goudbruin aan de buitenkant, rosé van binnen. de omeletlinten geven warmte, de avocado romigheid, de ingelegde gember het frisse accent. tokyo japans sushirijst water rijstazijn fijne kristalsuiker fijn zout eieren mirin lichte sojasaus neutrale olie grote coquilles, zonder koraal grote garnalen, gepeld en gekookt lichte sojasaus + sesamolie + rijstazijn (voor garnalen) tonijn uit blik, uitgelekt lichte sojasaus + sesamolie + citroensap + bieslook (voor tonijn) rijpe avocado, in dunne plakken komkommer, flinterdun gesneden ingelegde gember nori, in dunne reepjes zwart en wit sesamzaad, bieslook of lente-ui"}, {"slug": "japanse-rundvleessalade-rosbief-daikon-wasabi", "title": "Japanse rundvleessalade met rosbief, daikon en wasabi-dashi vinaigrette", "short_description": "Flinterdun gesneden rosbief met knapperige daikon, ingelegde rode ui en een scherpe wasabi-dashi vinaigrette.", "image": "/assets/images/japanse-rundvleessalade-rosbief-daikon-wasabi.jpg", "time": "25 min", "servings": "4 personen", "difficulty": "Makkelijk", "keuken": "Japans", "categorie": "groente-salade", "location": "Tokyo", "zoek": "japanse rundvleessalade met rosbief, daikon en wasabi-dashi vinaigrette een japans geïnspireerd voor rd in zelfgemaakte teriyakisaus met bruine suiker, gember en geroosterde ui — op rijst met frisse spitskool.", "image": "/assets/images/butadon-varkenshaas-teriyaki.jpg", "time": "35 min", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Japans", "categorie": "pasta-rijst", "location": "Obihiro", "zoek": "butadon — varkenshaas in huisgemaakte teriyakisaus met frisse spitskool en rijst butadon, de japanse varkens-donburi. de teriyakisaus wordt hier van nul gemaakt: sake, mirin, soja, palmsuiker, gember en kippenfond. de spitskool geeft het lichte, frisse tegenwicht dat de rijke saus nodig heeft. obihiro japans japanse kortkorrelige rijst water lichte sojasaus mirin sake bruine suiker verse gember, fijn geraspt knoflookteen, licht gekneusd lichte groentebouillon rijstazijn (aan het einde) varkenshaas, in medallions van 3 cm uien, in dunne halve ringen, gekaramelliseerd neutrale olie en klontje boter zeezout en witte peper spitskool, flinterdun gesneden rijstazijn zout en suiker"}, {"slug": "gyudon-entrecote-ui-paddenstoelen", "title": "Gyudon — entrecôte met gesmoorde ui, paddenstoelen en ingelegde rode rammenas", "short_description": "Flinterdun gesneden entrecôte 30 seconden in dashi-soja-mirinsaus met gekaramelliseerde ui en paddenstoelen — afgewerkt met felroze ingelegde rammenas.", "image": "/assets/images/gyudon-entrecote-ui-paddenstoelen.jpg", "time": "35 min + rammenas dag ervoor", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Japans", "categorie": "pasta-rijst", "location": "Tokyo", "zoek": "gyudon — entrecôte met gesmoorde ui, paddenstoelen en ingelegde rode rammenas gyudon lichter en gemberiger dan de butadon. de saus is bouillonachtiger en minder stroperig. het vlees gaat er pas 30 seconden in — langer maakt het taai. de felroze ingelegde rammenas is het visuele handtekening en het frisse tegenwicht. tokyo japans rode rammenas of rode radijsjes, in flinterdunne plakjes rijstazijn fijne kristalsuiker fijn zout dashi (instant ns", "categorie": "hapjes-tapas", "location": "Tokyo", "zoek": "nori-chip met avocado-wasabicrème en limoen eén hap die alles samenbrengt: de zilte knapperigheid van de nori, de romige pit van de avocado-wasabicrème, de frisheid van limoen. nori in droge doos bewaren — zelfs luchtvochtigheid maakt hem zacht. tokyo japans grote vellen nori, elk in 4 rechthoeken (16 chips totaal, 8 mooiste selecteren) neutrale olie gemengd met sesamolie wit en zwart sesamzaad fleur de sel rijpe avocados kewpie-mayonaise wasabipasta limoensap limoenrasp rijstazijn lichte sojasaus bieslook, fijn gesneden en witte peper extra limoenrasp, sesam en bieslookpuntjes"}, {"slug": "sashimi-coquille-shiso-olie-dashi-gelei", "title": "Sashimi van coquille met komkommer, shiso-olie en dashi-gelei", "short_description": "Flinterdun gesneden rauwe coquille op een spiegel van shiso-olie met knapperige komkommer, transparante dashi-gelei en witte soja.", "image": "/assets/images/sashimi-coquille-shiso-olie-dashi-gelei.jpg", "time": "30 min + 2 uur gelei", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Japans", "categorie": "vis-zeevruchten", "location": "Hokkaido", "zoek": "sashimi van coquille met komkommer, shiso-olie en dashi-gelei sashimi op zijn elegantst. de coquille is rauw — sashimi-kwaliteit, vraag de visboer expliciet. de shiso-olie is felgroen en geurig. de dashi-gelei glinstert als kleine bergkristallen. serveer op gekoelde borden. hokkaido japans dashi (instant) gelatineblaadje zout verse shiso-blaadjes neutrale olie (druivenpit) zout grote verse coquilles, sashimi-kwaliteit komkommer, flinterdun gesneden op mandoline shiro shoyu (witte soja) yuzu-olie verse shiso-blaadjes fleur de sel"}, {"slug": "daikonrol-rundertartaar-yuzu", "title": "Daikonrol met rundertartaar, zwarte sesam en yuzu", "short_description": "Flinterdunne ingelegde daikon strak opgerold rond verse rundertartaar met yuzu-sap, sesamolie en zwarte sesam.", "image": "/assets/images/daikonrol-rundertartaar-yuzu.jpg", "time": "30 min + 10 min pekelen", "servings": "4 amuses", "difficulty": "Gemiddeld", "keuken": "Japans", "categorie": "hapjes-tapas", "location": "Fukuoka", "zoek": "daikonrol met rundertartaar, zwarte sesam en yuzu transparant-witte daikonplakken ingelegd in rijstazijn, strak opgerold rond een cilindertje verse rundertartaar met yuzu, kewpie en gember. de zachte zuurheid snijdt door de rijke tartaar. yuzu-rasp als aromaat direct boven het bord geraspt. fukuoka japans kleine witte rammenas (daikon), op mandoline in flinterdunne plakken water rijstazijn fijne kristalsuiker fijn zout rundertartaar van de slager kleine sjalot, zeer fijn gesnipperd lichte sojasaus yuzu-sap of limoensap geroosterde sesamolie rijstazijn kewpie-mayonaise verse gember, fijn geraspt bieslook, fijn gesneden zwart sesamzaad en zwarte peper geroosterd zwart sesamzaad yuzu of limoen, rasp direct boven het bord lente-ui, in flinterdunne ringen"}, {"slug": "tomatendashi-perzik-burrata-nori-zout", "title": "Tomatendashi met perzik, burrata en nori-zout in glaasje", "short_description": "IJskoude heldere tomatendashi in een doorzichtig glaasje met sappige perzik, zachte burrata en zelfgemaakt nori-zout.", "image": "/assets/images/tomatendashi-perzik-burrata-nori-zout.jpg", "time": "35 min + nacht uitlekken", "servings": "4 amuses", "difficulty": "Gemiddeld", "keuken": "Japans", "categorie": "soep", "location": "Tokyo", "zoek": "tomatendashi met perzik, burrata en nori-zout in glaasje een ijskoude, heldere tomatendashi — licht, zuiver en vol naturelle umami. het tomatenwater druppelt een nacht door kaasdoek, nooit geperst. de perzik en burrata drijven erin als eilanden. nori-zout als finishing. tokyo japans vel nori, geroosterd en fijn verkruimeld fijn zeezout rijpe tomaten, grofgesneden en geblend lichte dashi (instant) rijstazijn shiro shoyu (witte soja) mirin fijn zout rijpe maar stevige gele perzik, in kleine blokjes aangemaakt met yuzu-sap burrata shiso- of bieslookolie yuzu of limoen, rasp"}, {"slug": "kobujime-zeebaars-gember-witte-soja", "title": "Kobujime van zeebaars met verse gember en witte soja", "short_description": "Rauwe zeebaars 2–3 uur geperst tussen kombu — de glutamaten trekken langzaam in de vis en geven diepere, ziltere umami. Gesneden als sashimi met gember en witte soja.", "image": "/assets/images/kobujime-zeebaars-gember-witte-soja.jpg", "time": "15 min + 2–3 uur persen", "servings": "4 personen", "difficulty": "Gemiddeld", "keuken": "Japans", "categorie": "vis-zeevruchten", "location": "Kanazawa", "zoek": "kobujime van zeebaars met verse gember en witte soja kobujime is geen marinade — het is een overdracht. de vis wordt tussen twee vellen kombu gelegd en licht gewogen. in 2–3 uur trekken de glutamaten van de kombu in het visvlees. het resultaat is steviger, dieper en zilter dan gewone sashimi. techniek boven ingrediënten. kanazawa japans zeebaarsfilet, sashimi-kwaliteit, zonder vel en graten grote vellen gedroogde kombu sake of rijstazijn om kombu te bevochtigen fijn zeezout verse gember, in flinterdunne julienne (2–3 sliertjes per bord) shiro shoyu (witte soja) fleur de sel"}, {"slug": "mahor-ananas-varkensgehakt-pinda", "title": "Mahor — ananas met gekaramelliseerd varkensgehakt, pinda en koriander", "short_description": "Klassieke Thaise amuse: knapperig stuk verse ananas als basis voor droge, gekaramelliseerde varkensgehaktvulling met palmsuiker, vissaus en koriander.", "image": "/assets/images/mahor-ananas-varkensgehakt-pinda.jpg", "time": "30 min", "servings": "4 amuses", "difficulty": "Makkelijk", "keuken": "Thais", "categorie": "hapjes-tapas", "location": "Bangkok", "zoek": "mahor — ananas met gekaramelliseerd varkensgehakt, pinda en koriander mahor is de thaise amuse die iedereen omver blaast en niemand verwacht. de heilige thaise driehoek — knoflook, korianderwortel en witte peper — vormt de basis. palmsuiker en vissaus karamelliseren het gehakt tot een droge, kleverige vulling. de ananas is het frisse fundament.   // Portie-hulpfunctie
  function berekenPortie(origStr, factor) {
    if (!origStr) return origStr;
    // Herken getal(len) in de string
    return origStr.replace(/(\d+(?:[,.]\d+)?)/g, (m) => {
      const n = parseFloat(m.replace(',','.'));
      const result = Math.round(n * factor * 10) / 10;
      return result % 1 === 0 ? result.toString() : result.toString().replace('.',',');
    });
  }

  function basisPortie(servStr) {
    if (!servStr) return 4;
    const m = servStr.match(/(\d+)/);
    return m ? parseInt(m[1]) : 4;
  }

  // State
  let actieveCat = '';
  let actieveKeuken = '';
  let zoekTerm = '';
  let portieAantal = 4;

  // Render
  function render() {
    const grid = document.getElementById('grid');
    const teller = document.getElementById('teller');

    // Filter
    let lijst = RECEPTEN.filter(r => {
      if (actieveCat && r.categorie !== actieveCat) return false;
      if (actieveKeuken && r.keuken !== actieveKeuken) return false;
      if (zoekTerm) {
        const q = zoekTerm.toLowerCase();
        if (!r.zoek.includes(q) && !r.title.toLowerCase().includes(q)) return false;
      }
      return true;
    });

    teller.textContent = lijst.length === RECEPTEN.length
      ? `${RECEPTEN.length} recepten`
      : `${lijst.length} van ${RECEPTEN.length} recepten`;

    if (lijst.length === 0) {
      grid.innerHTML = '<div class="geen-resultaten"><h3>Geen recepten gevonden</h3><p>Probeer een andere zoekterm of filter.</p></div>';
      return;
    }

    grid.innerHTML = lijst.map(r => {
      const basis = basisPortie(r.servings);
      const factor = portieAantal / (basis || 4);
      const portieLabel = basis === portieAantal
        ? r.servings
        : berekenPortie(r.servings, factor).replace(basis.toString(), portieAantal.toString());

      const catLabel = {
        'hapjes-tapas': 'Hapjes & Tapas',
        'vis-zeevruchten': 'Vis & Zeevruchten',
        'vlees': 'Vlees',
        'soep': 'Soep',
        'groente-salade': 'Groente & Salade',
        'pasta-rijst': 'Pasta & Rijst',
        'dessert': 'Dessert',
      }[r.categorie] || r.categorie;

      return `<a class="recept-card" href="/recepten/${r.slug}/">
        <img class="card-img" src="${r.image}" alt="${r.title}" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="card-img-placeholder" style="display:none">🍽️</div>
        <div class="card-body">
          <div class="card-cat">${catLabel} · ${r.keuken}</div>
          <div class="card-title">${r.title}</div>
          <div class="card-desc">${r.short_description}</div>
          <div class="card-meta">
            <span class="card-tag">⏱ ${r.time}</span>
            <span class="card-portie">👥 ${portieLabel}</span>
            <span class="card-tag">${r.difficulty}</span>
          </div>
        </div>
      </a>`;
    }).join('');
  }

  // Event listeners
  document.getElementById('zoek').addEventListener('input', e => {
    zoekTerm = e.target.value.trim();
    render();
  });

  document.getElementById('cat-filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    actieveCat = btn.dataset.cat;
    document.querySelectorAll('#cat-filters .filter-btn').forEach(b => b.classList.remove('actief'));
    btn.classList.add('actief');
    render();
  });

  document.getElementById('keuken-filters').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    actieveKeuken = btn.dataset.keuken;
    document.querySelectorAll('#keuken-filters .filter-btn').forEach(b => b.classList.remove('actief'));
    btn.classList.add('actief');
    render();
  });

  document.getElementById('portie-slider').addEventListener('input', e => {
    portieAantal = parseInt(e.target.value);
    document.getElementById('portie-val').textContent = portieAantal;
    render();
  });

  // Init
  render();
  </script>
