  <style>
    .portion-control {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--hover); border: 1px solid var(--border);
      border-radius: 999px; padding: 4px 12px 4px 6px;

    .portion-btn {

    .portion-count { font-weight: 700; min-width: 18px; text-align: center; }

    .ing-amount { transition: color 0.2s; }
    /* Kookstand knop */

      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--sans);
      font-size: 12px;
      padding: 5px 14px;
      border-radius: 20px;

      color: var(--muted);

    .reviews-section {

      font-size: 9px; letter-spacing: 3px; color: var(--accent);

    .review-aantal { font-size: 12px; color: var(--muted); }

    .review-form { background: var(--hover); padding: 24px; border-radius: 4px; margin-bottom: 32px; }

    .review-form input[type="text"],

      width: 100%; padding: 10px 14px;
      border: 0.5px solid var(--border); border-radius: 4px;
      background: #fff; font-family: var(--sans); font-size: 13px;

    .review-form button {
      background: var(--deep); color: var(--cream); border: none;

    .review-item { padding: 16px 0; border-bottom: 0.5px solid var(--border); }
    .review-item:last-child { border-bottom: none; }
    .review-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .review-naam { font-size: 13px; font-weight: 400; color: var(--deep); }
    .review-sterren { font-size: 14px; color: #C8860A; }

    @media (max-width: 640px) { .reviews-section { padding: 0 20px; } }

    /* Reviews sectie */
    .reviews-section {
      max-width: 860px;
      margin: 0 auto 3rem;
      padding: 0 44px;
    }
    .reviews-title {
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 0.5px solid var(--border);
    }

      display: flex;

    .ster-btn {
      font-size: 28px;
      background: none;
      border: none;
      cursor: pointer;
      color: #ddd;
      transition: color 0.15s, transform 0.1s;

    }
    .ster-btn.actief { color: #E8A020; }
    .ster-btn:hover { transform: scale(1.15); }
    .review-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 32px;

      background: #F5EDE0;

    .review-form input,
    .review-form textarea {
      font-family: var(--sans);

      border: 1px solid var(--border);

    .review-submit {

      padding: 10px 24px;
      border-radius: 20px;

    .review-submit:hover { background: var(--accent); }
    .review-submit:disabled { opacity: 0.5; cursor: default; }
    .review-item {

    .review-item:last-child { border-bottom: none; }
    .review-sterren { color: #E8A020; font-size: 16px; margin-bottom: 4px; }
    .review-naam { font-size: 12px; font-weight: 600; color: var(--deep); margin-bottom: 4px; }

  <script>
    const SUPABASE_URL = 'https://mgbqqbrsunwgspcizynp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_rJMEYgzdNqL9HeO2AM8tIg_yIv25qdX';

    function getSlug() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('slug')) return params.get('slug');
      const parts = window.location.pathname.split('/').filter(Boolean);
      return parts[parts.length - 1] || null;
    }

    function toIsoDuration(str) {
      if (!str) return null;
      const mins = parseInt(str);
      return isNaN(mins) ? null : 'PT' + mins + 'M';
    }

    // ── Portie-rekenmachine ──────────────────────────────────────
    const FIXED_RE = /^(naar smaak|snuf|snufje|royaal|paar druppels|naar wens|optioneel)/i;
    const VULGAR = {'½':0.5,'¼':0.25,'¾':0.75,'⅓':1/3,'⅔':2/3,'⅛':0.125,'⅜':0.375,'⅝':0.625,'⅞':0.875};

    function toNice(n) {
      if (n <= 0) return '0';
      const fracs = [[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞']];
      const whole = Math.floor(n), rem = n - whole;
      for (const [frac, sym] of fracs) if (Math.abs(rem - frac) < 0.04) return (whole > 0 ? whole + ' ' : '') + sym;
      if (Math.abs(n - Math.round(n)) < 0.05) return String(Math.round(n));
      return n.toFixed(1).replace('.', ',');
    }

    function parseAmount(raw) {
      if (!raw) return { fixed: true };
      const s = raw.trim();
      if (FIXED_RE.test(s)) return { fixed: true, suffix: s };
      let work = s.replace(/[½¼¾⅓⅔⅛⅜⅝⅞]/g, m => VULGAR[m] || m);
      work = work.replace(/^(\d+)\s+(0\.\d+)/, (_, a, b) => String(+a + +b));
      const rM = work.match(/^(\d*\.?\d+)\s*[–-]\s*(\d*\.?\d+)(.*)/);
      if (rM) return { fixed:false, value:(+rM[1]+rM[2])/2, lo:+rM[1], hi:+rM[2], suffix:rM[3].trim(), isRange:true };
      const fM = work.match(/^(\d+)\/(\d+)(.*)/);
      if (fM) return { fixed:false, value:+fM[1]/+fM[2], suffix:fM[3].trim() };
      const nM = work.match(/^(\d*\.?\d+)(.*)/);
      if (nM) return { fixed:false, value:parseFloat(nM[1]), suffix:nM[2].trim() };
      return { fixed: true, suffix: s };
    }

    function rescale(raw, factor) {
      const p = parseAmount(raw);
      if (p.fixed) return raw;
      if (p.isRange) {
        const nL = toNice(p.lo * factor), nH = toNice(p.hi * factor);
        return (nL === nH ? nL : nL + '–' + nH) + (p.suffix ? ' ' + p.suffix : '');
      }
      return (p.suffix ? toNice(p.value * factor) + ' ' + p.suffix : toNice(p.value * factor));
    }

    function applyFactor(factor) {
      document.querySelectorAll('.ing-amount[data-base]').forEach(el => {
        const t = rescale(el.dataset.base, factor);
        el.textContent = t;
        el.classList.toggle('changed', t !== el.dataset.base);
      });
    }

    function parseServings(str) {
      if (!str) return null;
      const m = str.match(/(\d+)/);
      return m ? parseInt(m[1]) : null;
    }

    function initPortions(base) {
      let current = base;
      const wrap = document.getElementById('portion-control');
      if (!wrap) return;
      const display = wrap.querySelector('.portion-count');
      const label   = wrap.querySelector('.portion-label');
      const btnMin  = wrap.querySelector('.portion-btn.min');
      const btnPlus = wrap.querySelector('.portion-btn.plus');
      function update() {
        display.textContent = current;
        label.textContent = current === 1 ? 'persoon' : 'personen';
        btnMin.disabled = current <= 1;
        applyFactor(current / base);
      }
      btnMin.addEventListener('click', () => { if (current > 1) { current--; update(); }});
      btnPlus.addEventListener('click', () => { current++; update(); });
      update();
    }

    // ── Supabase ─────────────────────────────────────────────────
    async function haalReviews(slug) {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/reviews?slug=eq.${encodeURIComponent(slug)}&order=aangemaakt_op.desc`,
          { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }}
        );
        return res.ok ? await res.json() : [];
      } catch { return []; }
    }

    async function slaReviewOp(slug, rating, naam, opmerking) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/reviews`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ slug, rating, naam: naam || 'Anoniem', opmerking })
        });
        return res.ok || res.status === 201;
      } catch { return false; }
    }

    function sterren(n) {
      const v = Math.round(n);
      return '★'.repeat(v) + '☆'.repeat(5 - v);
    }

    function datumStr(iso) {
      return new Date(iso).toLocaleDateString('nl-NL', { day:'numeric', month:'long', year:'numeric' });
    }

    async function renderReviews(slug, schema) {
      const reviews = await haalReviews(slug);
      const blok = document.getElementById('reviews-blok');

      const gem = reviews.length
        ? (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1)
        : null;

      if (gem && reviews.length >= 1) {
        schema.aggregateRating = {
          "@type": "AggregateRating",
          "ratingValue": gem,
          "reviewCount": String(reviews.length)
        };
        document.getElementById('recipe-schema').textContent = JSON.stringify(schema);
      }

      const scoreHtml = gem ? `
        <div class="review-score-blok">
          <div class="review-getal">${gem}</div>
          <div>
            <div class="review-sterren-groot">${sterren(parseFloat(gem))}</div>
            <div class="review-aantal">${reviews.length} ${reviews.length === 1 ? 'beoordeling' : 'beoordelingen'}</div>
          </div>
        </div>` : '';

      const lijstHtml = reviews.map(r => `
        <div class="review-item">
          <div class="review-item-top">
            <span class="review-naam">${r.naam || 'Anoniem'}</span>
            <span class="review-sterren">${sterren(r.rating)}</span>
          </div>
          ${r.opmerking ? `<div class="review-opmerking">${r.opmerking}</div>` : ''}
          <div class="review-datum">${datumStr(r.aangemaakt_op)}</div>
        </div>`).join('');

      blok.innerHTML = `
        <div class="reviews-section">
          <div class="reviews-title">Beoordelingen</div>
          ${scoreHtml}
          <div class="review-form">
            <h3>Laat een beoordeling achter</h3>
            <div class="ster-keuze">
              ${[5,4,3,2,1].map(i => `
                <input type="radio" id="ster${i}" name="rating" value="${i}">
                <label for="ster${i}">★</label>`).join('')}
            </div>
            <input type="text" id="review-naam" placeholder="Jouw naam (optioneel)" maxlength="60">
            <textarea id="review-opmerking" placeholder="Jouw opmerking (optioneel)" maxlength="500"></textarea>
            <button onclick="verstuurReview('${slug}')">Beoordeling plaatsen</button>
            <div class="melding" id="review-melding"></div>
          </div>
          ${lijstHtml}
        </div>`;
    }

    window.verstuurReview = async function(slug) {
      const ratingEl = document.querySelector('input[name="rating"]:checked');
      const melding  = document.getElementById('review-melding');
      if (!ratingEl) { melding.textContent = 'Kies eerst een aantal sterren.'; return; }
      const rating    = parseInt(ratingEl.value);
      const naam      = document.getElementById('review-naam').value.trim();
      const opmerking = document.getElementById('review-opmerking').value.trim();
      melding.textContent = 'Bezig met opslaan…';
      const ok = await slaReviewOp(slug, rating, naam, opmerking);
      if (ok) {
        melding.textContent = 'Bedankt voor je beoordeling!';
        setTimeout(() => location.reload(), 1200);
      } else {
        melding.textContent = 'Er ging iets mis. Probeer het opnieuw.';
      }
    };

    // ── Hoofdlogica ───────────────────────────────────────────────
    const slug = getSlug();
    if (!slug) { window.location.href = '/'; }

    fetch('/data/recipes.json')
      .then(r => r.json())
      .then(data => {
        const recipe = (data.recipes || []).find(r => r.slug === slug);
        if (!recipe) {
          document.getElementById('content').innerHTML =
            '<div class="error-page">Recept niet gevonden. <a href="/">Terug naar overzicht</a></div>';
          return;
        }

        document.title = recipe.title + ' – Het Proeven';
        document.querySelector('meta[name="description"]').content = recipe.description || '';
        document.querySelector('meta[property="og:title"]').content = recipe.title + ' – Het Proeven';
        document.querySelector('meta[property="og:description"]').content = recipe.description || '';
        if (recipe.image) document.querySelector('meta[property="og:image"]').content = recipe.image;

        const allIngredients = (recipe.ingredient_groups || [])
          .flatMap(g => (g.ingredients || []).map(i => i.amount + ' ' + i.name));

        const schema = {
          "@context": "https://schema.org/",
          "@type": "Recipe",
          "name": recipe.title,
          "description": recipe.description || '',
          "author": { "@type": "Person", "name": "Edwin van Leeuwen" },
          "recipeYield": recipe.servings || '',
          "recipeCategory": recipe.location || '',
          "recipeIngredient": allIngredients,
          "recipeInstructions": (recipe.steps || []).map((step, i) => ({
            "@type": "HowToStep",
            "position": i + 1,
            "name": step.action,
            "text": step.action + ': ' + step.description
          }))
        };

        const duration = toIsoDuration(recipe.time);
        if (duration) schema.totalTime = duration;
        if (recipe.image) schema.image = [recipe.image];
        document.getElementById('recipe-schema').textContent = JSON.stringify(schema);

        const baseServings = parseServings(recipe.servings) || 4;

        const ingHtml = (recipe.ingredient_groups || []).map(group => `
          <div class="ing-cat">${group.group_name}</div>
          ${(group.ingredients || []).map(ing => `
            <div class="ing-row">
              <span>${ing.name}</span>
              <span class="ing-amount" data-base="${ing.amount}">${ing.amount}</span>
            </div>`).join('')}`).join('');

        const stepsHtml = (recipe.steps || []).map((step, i) => `
          <div class="step">
            <div class="step-num">${i + 1}</div>
            <div class="step-text"><strong>${step.action}:</strong> ${step.description}</div>
          </div>`).join('');

        // Tips: gebruik tips-array als beschikbaar, anders chef_tip als één blok
        var tipsArr = [];
        if (recipe.tips && recipe.tips.length) {
          tipsArr = recipe.tips;
        } else if (recipe.chef_tip) {
          tipsArr = [recipe.chef_tip];
        }

        function renderTip(tip) {
          var colonIdx = tip.indexOf(': ');
          if (colonIdx > 0 && colonIdx < 30) {
            var label = tip.substring(0, colonIdx);
            var body  = tip.substring(colonIdx + 2);
            return '<p style="margin:0 0 10px 0"><strong>' + label + ':</strong> ' + body + '</p>';
          }
          return '<p style="margin:0 0 10px 0">' + tip + '</p>';
        }

        const tipHtml = tipsArr.length ? (
          '<div class="chef-tip"><span class="chef-tip-label">Tips</span>' +
          tipsArr.map(renderTip).join('') +
          '</div>'
        ) : '';

        const wine = recipe.wine;
        const wineNaam = wine && typeof wine === 'object' ? wine.naam : wine;
        const variatiesHtml = recipe.variaties ? `
          <div class="chef-tip" style="margin-top:12px;border-left-color:#7A6A5A;">
            <span class="chef-tip-label" style="color:#7A6A5A;">Variaties & Alternatieven</span>
            ${recipe.variaties}
          </div>` : '';

        const wineHtml = wine && typeof wine === 'object' ? `
          <div class="wine-section">
            <div class="wine-section-title">🍷 Wijnadvies</div>
            <div class="wine-naam">${wine.naam}</div>
            <div class="wine-meta">
              ${wine.druif ? `<span class="wine-tag">🍇 ${wine.druif}</span>` : ''}
              ${wine.alternatief ? `<span class="wine-tag">🔄 Alternatief: ${wine.alternatief}</span>` : ''}
            </div>
            ${wine.toelichting ? `<p class="wine-toelichting">${wine.toelichting}</p>` : ''}
          </div>` : '';

        document.getElementById('content').innerHTML = `
          <a href="/" class="back-btn">← Terug naar recepten</a>
          <div class="recipe-hero" style="${recipe.image ? `background-image:url(${recipe.image})` : ''}">
            <span class="recipe-loc-tag">${recipe.location || ''}</span>
          </div>
          <h1 class="recipe-title">${recipe.title}</h1>
          <p class="recipe-desc">${recipe.description || ''}</p>
          <div class="recipe-meta">
            ${recipe.time ? `<span class="tag">${recipe.time}</span>` : ''}
            ${recipe.servings ? `<span class="tag">${recipe.servings}</span>` : ''}
            ${recipe.difficulty ? `<span class="tag tag-acc">${recipe.difficulty}</span>` : ''}
            ${wineNaam ? `<span class="tag tag-wine">🍷 ${wineNaam}</span>` : ''}
            <span style="margin-left:auto">
              <button class="kookstand-btn" id="kookstand-btn" title="Scherm aanblijven tijdens het koken">
                🍳 Kookstand
              </button>
            </span>
          </div>
          <div class="recipe-body">
            <div>
              <div class="col-h" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
                Ingrediënten
                <div id="portion-control" class="portion-control">
                  <button class="portion-btn min">−</button>
                  <span class="portion-count">${baseServings}</span>
                  <span class="portion-label">${baseServings === 1 ? 'persoon' : 'personen'}</span>
                  <button class="portion-btn plus">+</button>
                </div>
              </div>
              ${ingHtml}
            </div>
            <div>
              <div class="col-h">Bereiding</div>
              ${stepsHtml}
              ${tipHtml}
              ${variatiesHtml}
            </div>
          </div>
          ${wineHtml}`;

        initPortions(baseServings);
        renderReviews(slug, schema);
      })
      .catch(() => {
        document.getElementById('content').innerHTML =
          '<div class="error-page">Er ging iets mis. <a href="/">Terug naar overzicht</a></div>';
      });
  </script>

</body>
</html>
