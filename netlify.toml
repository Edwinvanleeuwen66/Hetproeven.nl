[build]
  publish = "."

# Statische receptpagina's hebben voorrang — met slash
[[redirects]]
  from = "/recepten/:slug/"
  to = "/recepten/:slug/index.html"
  status = 200

# Statische receptpagina's hebben voorrang — zonder slash
[[redirects]]
  from = "/recepten/:slug"
  to = "/recepten/:slug/index.html"
  status = 200

# Admin redirect
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
