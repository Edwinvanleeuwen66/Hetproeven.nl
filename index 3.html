<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Het Proeven — Kleine gerechtjes. Grote obsessie.</title>
  <meta name="description" content="Van pintxo tot saté. Van cava tot rioja. Alles draait om smaak.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Het Proeven">
  <meta property="og:title" content="Het Proeven — Kleine gerechtjes. Grote obsessie.">
  <meta property="og:description" content="Van pintxo tot saté. Van cava tot rioja. Alles draait om smaak.">
  <meta property="og:url" content="https://www.hetproeven.nl/">
  <meta property="og:image" content="https://www.hetproeven.nl/assets/images/og-default.jpg">
  <link rel="canonical" href="https://www.hetproeven.nl/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    .zoek-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.5rem 0;
    }
    .zoek-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .zoek-icon {
      position: absolute;
      left: 14px;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }
    .zoek-input {
      width: 100%;
      padding: 10px 36px 10px 38px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      font-family: var(--sans);
      font-size: 14px;
      color: var(--deep);
      outline: none;
      transition: border-color 0.2s;
    }
    .zoek-input:focus { border-color: var(--accent); }
    .zoek-input::placeholder { color: var(--muted); }
    .zoek-clear {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      display: none;
      line-height: 1;
    }
    .zoek-clear.zichtbaar { display: block; }
    .zoek-resultaat {
      font-size: 11px;
      color: var(--muted);
      padding: 6px 4px 0;
      letter-spacing: 0.03em;
    }
  </style>
</head>
<body>

  <nav class="nav">
    <a href="/" class="logo">Het Proeven</a>
    <div class="nav-links">
      <a href="/">Recepten</a>
      <a href="/wijnspijs-gids.html">Wijn & Spijs</a>
      <a href="/sterrenkok-gids.html">Sterrenkok</a>
      <a href="/over.html">Over</a>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Kleine gerechtjes.<br>Grote obsessie.</h1>
      <p>Van pintxo tot saté. Van cava tot rioja. Alles draait om smaak.</p>
    </div>
  </header>

  <div class="zoek-wrap">
    <div class="zoek-input-wrap">
      <span class="zoek-icon">🔍</span>
      <input type="search" class="zoek-input" id="zoek-input" 
             placeholder="Zoek op naam, ingrediënt of keuken…"
             autocomplete="off" spellcheck="false">
      <button class="zoek-clear" id="zoek-clear" title="Wis zoekopdracht">✕</button>
    </div>
    <div class="zoek-resultaat" id="zoek-resultaat"></div>
  </div>

  <div class="filter-wrap">
    <div class="filter-row">
      <span class="filter-label">Soort</span>
      <div class="filter-bar" id="filter-categorie">
        <button class="filter-btn active" data-filter="all">Alles</button>
        <button class="filter-btn" data-filter="hapjes-tapas">Hapjes & Tapas</button>
        <button class="filter-btn" data-filter="vis-zeevruchten">Vis & Zeevruchten</button>
        <button class="filter-btn" data-filter="vlees">Vlees</button>
        <button class="filter-btn" data-filter="groente-salade">Groente & Salade</button>
        <button class="filter-btn" data-filter="soep">Soep</button>
        <button class="filter-btn" data-filter="pasta-rijst">Pasta & Rijst</button>
        <button class="filter-btn" data-filter="dessert">Dessert</button>
      </div>
    </div>

    <div class="filter-row filter-row-keuken">
      <span class="filter-label">Keuken</span>
      <div class="filter-bar" id="filter-keuken">
        <button class="filter-btn-sm active" data-filter="all">Alles</button>
        <button class="filter-btn-sm" data-filter="Spaans">🇪🇸 Spaans</button>
        <button class="filter-btn-sm" data-filter="Italiaans">🇮🇹 Italiaans</button>
        <button class="filter-btn-sm" data-filter="Nederlands">🇳🇱 Nederlands</button>
        <button class="filter-btn-sm" data-filter="Indonesisch">🇮🇩 Indonesisch</button>
        <button class="filter-btn-sm" data-filter="Grieks">🇬🇷 Grieks</button>
        <button class="filter-btn-sm" data-filter="Frans">🇫🇷 Frans</button>
        <button class="filter-btn-sm" data-filter="Thais">🇹🇭 Thais</button>
        <button class="filter-btn-sm" data-filter="Chinees">🇨🇳 Chinees</button>
        <button class="filter-btn-sm" data-filter="Japans">🇯🇵 Japans</button>
        <button class="filter-btn-sm" data-filter="Mexicaans">🇲🇽 Mexicaans</button>
        <button class="filter-btn-sm" data-filter="Overig">🌍 Overig</button>
      </div>
    </div>
  </div>


  <div class="filter-wrap" style="border-bottom:none;padding-bottom:0.5rem;">
    <div class="filter-row" style="border-bottom:none;padding:0.5rem 0;">
      <span class="filter-label">Mijn lijst</span>
      <div class="filter-bar">
        <button class="filter-btn" id="btn-favorieten" onclick="toggleMijnFilter('favorieten')">♥ Favorieten</button>
        <button class="filter-btn" id="btn-vandaag" onclick="toggleMijnFilter('vandaag')">🍳 Vandaag koken</button>
      </div>
    </div>
  </div>

  <div class="recipe-grid" id="recipe-grid">
    <div class="loading">Recepten laden…</div>
  </div>

  <footer>
    <p>© Het Proeven</p>
    <a href="/over.html">Over ons</a>
  </footer>

  <script>
    let allRecipes = [];
    let activeKeuken = 'all';
    let activeCategorie = 'all';
    let activeMijnFilter = null; // 'favorieten' of 'vandaag'


    // localStorage helpers
    function loadSet(key) {
      try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); } catch { return new Set(); }
    }
    function saveSet(key, set) {
      try { localStorage.setItem(key, JSON.stringify([...set])); } catch {}
    }
    let favorieten = loadSet('hp_favorieten');
    let vandaag    = loadSet('hp_vandaag');

    function toggleSlug(type, slug, btn) {
      event.preventDefault();
      event.stopPropagation();
      const set = type === 'favorieten' ? favorieten : vandaag;
      const cls = type === 'favorieten' ? 'active' : 'active-vandaag';
      if (set.has(slug)) { set.delete(slug); btn.classList.remove(cls); }
      else                { set.add(slug);    btn.classList.add(cls); }
      saveSet('hp_' + type, set);
      if (activeMijnFilter === type) renderRecipes();
    }

    function toggleMijnFilter(type) {
      if (activeMijnFilter === type) {
        activeMijnFilter = null;
        document.getElementById('btn-' + type).classList.remove('active');
      } else {
        activeMijnFilter = type;
        ['favorieten','vandaag'].forEach(t => {
          document.getElementById('btn-' + t).classList.toggle('active', t === type);
        });
      }
      renderRecipes();
      initLazyBg();
    }


    // ── Lazy loading kaartfoto's ─────────────────────────────────
    function initLazyBg() {
      if (!('IntersectionObserver' in window)) {
        // Fallback: laad alles direct
        document.querySelectorAll('.lazy-bg[data-bg]').forEach(el => {
          el.style.backgroundImage = 'url(' + el.dataset.bg + ')';
        });
        return;
      }
      const obs = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const el = entry.target;
            el.style.backgroundImage = 'url(' + el.dataset.bg + ')';
            el.classList.remove('lazy-bg');
            obs.unobserve(el);
          }
        });
      }, { rootMargin: '200px' });

      document.querySelectorAll('.lazy-bg[data-bg]').forEach(el => obs.observe(el));
    }


    // ── Zoekfunctie ─────────────────────────────────────────────
    let zoekQuery = '';

    const zoekInput = document.getElementById('zoek-input');
    const zoekClear = document.getElementById('zoek-clear');
    const zoekResultaat = document.getElementById('zoek-resultaat');

    function normaliseer(str) {
      return (str || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function zoekFilter(r) {
      if (!zoekQuery) return true;
      const q = normaliseer(zoekQuery);
      const velden = [
        r.title, r.short_description, r.description,
        r.location, r.keuken, r.categorie,
        ...(r.ingredient_groups || []).flatMap(g => 
          (g.ingredients || []).map(i => i.name)
        )
      ];
      return velden.some(v => normaliseer(v).includes(q));
    }

    zoekInput.addEventListener('input', () => {
      zoekQuery = zoekInput.value.trim();
      zoekClear.classList.toggle('zichtbaar', zoekQuery.length > 0);
      renderRecipes();
      initLazyBg();
    });

    zoekClear.addEventListener('click', () => {
      zoekInput.value = '';
      zoekQuery = '';
      zoekClear.classList.remove('zichtbaar');
      zoekResultaat.textContent = '';
      zoekInput.focus();
      renderRecipes();
      initLazyBg();
    });

    function renderRecipes() {
      const grid = document.getElementById('recipe-grid');
      let filtered = allRecipes;
      if (activeKeuken !== 'all') filtered = filtered.filter(r => r.keuken === activeKeuken);
      if (activeCategorie !== 'all') filtered = filtered.filter(r => r.categorie === activeCategorie);
      if (activeMijnFilter === 'favorieten') filtered = filtered.filter(r => favorieten.has(r.slug));
      if (activeMijnFilter === 'vandaag')    filtered = filtered.filter(r => vandaag.has(r.slug));
      if (zoekQuery) filtered = filtered.filter(zoekFilter);
      if (zoekQuery) {
        zoekResultaat.textContent = filtered.length === 0
          ? 'Geen recepten gevonden voor "' + zoekQuery + '"'
          : filtered.length + ' recept' + (filtered.length === 1 ? '' : 'en') + ' gevonden';
      } else {
        zoekResultaat.textContent = '';
      }
      if (filtered.length === 0) {
        grid.innerHTML = '<p class="empty">Geen recepten gevonden.</p>';
        return;
      }
      grid.innerHTML = filtered.map((r, i) => {
        const wineNaam = r.wine && typeof r.wine === 'object' ? r.wine.naam : r.wine;
        const eager = i < 6;
        const imgAttr = r.image
          ? (eager ? `style="background-image:url(${r.image})"` : `data-bg="${r.image}"`)
          : '';
        const isFav     = favorieten.has(r.slug);
        const isVandaag = vandaag.has(r.slug);
        return `
          <div class="card-wrap">
            <a href="/recepten/${encodeURIComponent(r.slug)}" class="card">
              <div class="card-img${eager ? '' : ' lazy-bg'}" ${imgAttr}></div>
              <div class="card-body">
                <div class="card-loc">${r.location || ''}</div>
                <div class="card-title">${r.title}</div>
                <p>${r.short_description || ''}</p>
                <div class="tags">
                  ${r.time ? `<span class="tag">${r.time}</span>` : ''}
${r.difficulty ? `<span class="tag tag-acc">${r.difficulty}</span>` : ''}
                  ${wineNaam ? `<span class="tag tag-wine">🍷 ${wineNaam}</span>` : ''}
                </div>
              </div>
            </a>
            <div class="card-actions">
              <button class="card-action-btn${isFav ? ' active' : ''}" title="Favoriet" onclick="toggleSlug('favorieten','${r.slug}',this)">♥</button>
              <button class="card-action-btn${isVandaag ? ' active-vandaag' : ''}" title="Vandaag koken" onclick="toggleSlug('vandaag','${r.slug}',this)">🍳</button>
            </div>
          </div>`;
      }).join('');
    }

    document.querySelectorAll('#filter-categorie .filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filter-categorie .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategorie = btn.dataset.filter;
        renderRecipes();
        initLazyBg();
      });
    });

    document.querySelectorAll('#filter-keuken .filter-btn-sm').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#filter-keuken .filter-btn-sm').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeKeuken = btn.dataset.filter;
        renderRecipes();
        initLazyBg();
      });
    });

    fetch('/data/recipes.json')
      .then(r => r.json())
      .then(data => {
        allRecipes = (data.recipes || []).slice().reverse();
        renderRecipes();
        initLazyBg();
      })
      .catch(() => {
        document.getElementById('recipe-grid').innerHTML = '<p class="empty">Recepten konden niet worden geladen.</p>';
      });

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
      });
    }
  </script>
</body>
</html>
